name: Publish beta release
on:
  push:
    branches: [main]
    paths: ['.github/releases/v0.1.0-beta.2.md']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v0.1.0-beta.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.1.0-beta.2
      SOURCE_SHA: be3c29e4a790044e6908415aeb4856d67a484f96
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm validated source and CI result
        run: |
          git diff --exit-code "$SOURCE_SHA" HEAD -- Source VCE-Flour-Alternatives tools tests requirements-test.txt
          gh api "repos/$GH_REPO/actions/runs/40082616273" --jq '{status,conclusion,head_sha}' > ci-result.json
          python - <<'PY'
          import json
          r=json.load(open('ci-result.json'))
          assert r=={'status':'completed','conclusion':'success','head_sha':'be3c29e4a790044e6908415aeb4856d67a484f96'},r
          PY
      - uses: actions/download-artifact@v4
        with:
          name: VCE-Flour-Alternatives-development
          run-id: 40082616273
          github-token: ${{ github.token }}
          path: beta-input
      - name: Check artifact and prepare beta ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile
          root=Path('beta-input')
          manifest=json.loads((root/'build-manifest.json').read_text())
          data=(root/'VCE-Flour-Alternatives-dev.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['zip_sha256']
          assert manifest['in_game_verified'] is False
          with zipfile.ZipFile(root/'VCE-Flour-Alternatives-dev.zip') as z:
              names=z.namelist()
              source_files=subprocess.check_output(['git','ls-tree','-r','--name-only',os.environ['SOURCE_SHA'],'--','VCE-Flour-Alternatives'],text=True).splitlines()
              expected={n for n in source_files if n.endswith(('.xml','.png')) or n=='VCE-Flour-Alternatives/README.md'}
              expected.update(f'VCE-Flour-Alternatives/{v}/Assemblies/VCEFlourAlternatives.dll' for v in ('1.6','1.7'))
              assert set(names)==expected and len(names)==len(expected),(set(names)^expected,len(names))
              for name in source_files:
                  if name in expected:
                      assert z.read(name)==Path(name).read_bytes(),name
              assert 'VCE-Flour-Alternatives/Defs/ThingCategoryDefs/GrainFlour.xml' in names
              assert 'VCE-Flour-Alternatives/Patches/PFA_GrainFlour.xml' in names
              assert 'VCE-Flour-Alternatives/Languages/Japanese/DefInjected/ThingCategoryDef/GrainFlour.xml' in names
              dlls=[n for n in names if n.endswith('.dll')]
              assert set(dlls)=={f'VCE-Flour-Alternatives/{v}/Assemblies/VCEFlourAlternatives.dll' for v in ('1.6','1.7')}
              assert not any(n.endswith(('.cs','.csproj','.py','.pdb')) for n in names)
              for build in manifest['builds']:
                  path=f"VCE-Flour-Alternatives/{build['game'][:3]}/Assemblies/VCEFlourAlternatives.dll"
                  assert hashlib.sha256(z.read(path)).hexdigest()==build['sha256']
          Path('VCE-Flour-Alternatives-0.1.0-beta.2.zip').write_bytes(data)
          print('Verified runtime-only beta package:',hashlib.sha256(data).hexdigest())
          PY
      - name: Create draft with asset, then publish prerelease
        run: |
          gh release create "$TAG" VCE-Flour-Alternatives-0.1.0-beta.2.zip --target "$GITHUB_SHA" --draft --prerelease --title "VCE Flour Alternatives v0.1.0-beta.2" --notes-file .github/releases/v0.1.0-beta.2.md
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets
