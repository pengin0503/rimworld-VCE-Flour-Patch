# Publishes a release from a pushed tag (v1.2.3 or v1.2.3-beta.1), or from Actions > Publish release > Run workflow
# on main with that tag, which creates the tag on the checked commit only after every check passes. Nothing release-specific is
# written here: the tag must match Source/VCEFlourAlternatives.csproj <Version> and About.xml
# <modVersion>, and .github/releases/<tag>.md holds the notes. The ZIP is built and verified
# from the tagged commit itself, so no CI run ID or source SHA has to be copied in.
name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create on the selected main commit, e.g. v0.2.0
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists" >&2; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-test.txt
      - name: Check tag, versions and notes before building
        run: python -c "import os,sys;sys.path.insert(0,'tools');import check_release;print(check_release.check_versions(os.environ['TAG']))"
      - name: Build and verify
        run: python tools/verify.py
      - name: Check the package against the tagged source
        id: package
        run: |
          version="${TAG#v}"
          python tools/check_release.py --tag "$TAG" --output "dist/VCE-Flour-Alternatives-${version}.zip" | tee check.txt
          echo "zip=dist/VCE-Flour-Alternatives-${version}.zip" >> "$GITHUB_OUTPUT"
          if grep -q 'prerelease=true' check.txt; then echo "flag=--prerelease" >> "$GITHUB_OUTPUT"; else echo "flag=--latest" >> "$GITHUB_OUTPUT"; fi
      - name: Create the tag on this commit (dispatched runs)
        if: github.event_name == 'workflow_dispatch'
        run: gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
      - name: Publish
        run: |
          gh release create "$TAG" "${{ steps.package.outputs.zip }}" --verify-tag ${{ steps.package.outputs.flag }} \
            --title "VCE Flour Alternatives $TAG" --notes-file ".github/releases/$TAG.md"
          gh release view "$TAG" --json url,isPrerelease,assets
