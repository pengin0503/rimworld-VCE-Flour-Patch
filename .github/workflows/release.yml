# Publishes a release from a pushed tag (v1.2.3 or v1.2.3-beta.1). Nothing release-specific is
# written here: the tag must match Source/VCEFlourAlternatives.csproj <Version> and About.xml
# <modVersion>, and .github/releases/<tag>.md holds the notes. The ZIP is built and verified
# from the tagged commit itself, so no CI run ID or source SHA has to be copied in.
name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-test.txt
      - name: Check tag, versions and notes before building
        run: python -c "import sys;sys.path.insert(0,'tools');import check_release;print(check_release.check_versions('$TAG'))"
      - name: Build and verify
        run: python tools/verify.py
      - name: Check the package against the tagged source
        id: package
        run: |
          version="${TAG#v}"
          python tools/check_release.py --tag "$TAG" --output "dist/VCE-Flour-Alternatives-${version}.zip" | tee check.txt
          echo "zip=dist/VCE-Flour-Alternatives-${version}.zip" >> "$GITHUB_OUTPUT"
          if grep -q 'prerelease=true' check.txt; then echo "flag=--prerelease" >> "$GITHUB_OUTPUT"; else echo "flag=--latest" >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        run: |
          gh release create "$TAG" "${{ steps.package.outputs.zip }}" --verify-tag ${{ steps.package.outputs.flag }} \
            --title "VCE Flour Alternatives $TAG" --notes-file ".github/releases/$TAG.md"
          gh release view "$TAG" --json url,isPrerelease,assets
